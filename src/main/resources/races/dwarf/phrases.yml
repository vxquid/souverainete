sleepInterruptionPhrases:
  - "By my beard! Can't a dwarf rest his eyes?"
  - "I was dreaming of a vein of pure mithril!"
  - "What is it? The mountain isn't collapsing, is it?"
  - "Hmph... five more minutes, or five more centuries."
  - "You woke me up? This better be about free ale."
  - "Keep it down! My head hurts from last night's brew."
  - "Unless you're a goblin invasion, let me sleep."
  - "I work hard in the mines, I sleep hard in the bed."
  - "By Durin's beard, you are noisy."
  - "Is the forge on fire? No? Then begone."
  - "I was just about to find the Arkenstone in my dream!"
  - "Stone and silence! That's all I ask for."
  - "Ugh... sunlight already? Disgusting."
  - "My ancestors sleep eternally, why can't I sleep for an hour?"
  - "You have the stealth of a falling boulder."
  - "Wake me when the dragon comes."
  - "I'm not sleeping, I'm inspecting the inside of my eyelids."
  - "Do you know how heavy this beard is? I need rest."
  - "Loud footsteps. Must be a human."
  - "If you wake the baby, I will strike you."
  - "Grrr... snort... who goes there?"
  - "I swear by the hammer, let me dream."
  - "Too early. Come back when the moon is up."
  - "I was drinking with the gods in my sleep."
  - "Did the tunnel collapse? No? Then leave me."
  - "Rest is the foundation of strength."
  - "My snoring is the song of my people. Let it play."
  - "You're lucky I didn't reach for my axe."
  - "A dwarf needs his beauty sleep. Look at this rugged face!"
  - "Interrupt my rest again, and you'll mine coal for a month."

damagePhrases:
  - "That tickles! Hit harder!"
  - "My armor is thicker than your skull!"
  - "You'll pay for that with blood!"
  - "Is that the best you've got, tall-folk?"
  - "I've had harder hits from falling rocks!"
  - "My skin is tough as granite!"
  - "You call that a blow? My grandmother hits harder!"
  - "You dented my favorite pauldron!"
  - "I will shave your head for that!"
  - "By the forge, that actually hurt!"
  - "Aaargh! I'll crush you!"
  - "Blood! Finally, a real fight!"
  - "You've wakened the sleeping bear!"
  - "I'm built of stone and iron!"
  - "Strike me down, and I'll break your weapon!"
  - "My beard protects me better than your shield!"
  - "Oof! Solid hit. Now it's my turn."
  - "You'll blunt your blade on my bones."
  - "I've survived cave-ins worse than you!"
  - "That's it! No more Mister Nice Dwarf."
  - "You made me spill my drink!"
  - "Ironbreaker! Defend me!"
  - "You dare strike a son of the mountain?"
  - "I'll turn you into gravel!"
  - "Tis but a scratch on the stone."
  - "My anger burns hotter than magma!"
  - "You're going to regret that."
  - "I'll mount your head on my wall!"
  - "Ancestors, give me strength!"
  - "Hammer and tongs! That stung!"

joblessPhrases:
  - "I've laid down my hammer for today."
  - "The guild hasn't assigned me a station yet."
  - "I'm technically on a break. A long one."
  - "No wares to sell, just stories to tell."
  - "The forge is cold, and so is my ambition today."
  - "I'm a dwarf of leisure at the moment."
  - "Ask the foreman, I'm just loitering."
  - "I've got no trade for you, traveler."
  - "My hands are empty, but my heart is full of ale."
  - "I'm between projects. Very important projects."
  - "Looking for work? So am I."
  - "I'm retired. Or fired. One of the two."
  - "No iron, no gold, no trade."
  - "I'm just inspecting the stonework here."
  - "Do I look like a merchant to you?"
  - "I'm waiting for the caravan to bring supplies."
  - "My pickaxe is broken, so I'm useless."
  - "I don't have a job, I have a lifestyle."
  - "The economy is tough underground."
  - "I'm saving my strength for the war."
  - "Go bother the smith, I'm just a miner."
  - "I've got nothing but the lint in my pockets."
  - "Trade? I can trade you a handshake."
  - "I'm observing the structural integrity of this wall."
  - "Not working. Just thinking about gold."
  - "My shift ended an hour ago."
  - "I'm on a diplomatic mission. Sort of."
  - "No business today. The stars aren't right."
  - "I'm fasting from labor."
  - "Unless you're hiring, move along."

noItemsToTradePhrases:
  - "Sold out! The caravans took everything."
  - "Nothing left but dust and echoes."
  - "The mines have been stingy lately."
  - "I've got nothing. Come back next moon."
  - "Dry as a bone. No stock."
  - "The goblins raided my supply wagon."
  - "I drank all the profits. Sorry."
  - "Empty pockets, empty shelves."
  - "I'm waiting on a shipment from the deep roads."
  - "You're too late! The elves bought it all."
  - "Fresh out of iron. Fresh out of everything."
  - "My inventory is lighter than an elf's promise."
  - "Look around. Do you see anything? Me neither."
  - "The forge broke. Production is halted."
  - "I've sold my last nugget."
  - "Nothing to see here."
  - "My bag is empty, friend."
  - "Supplies are scarce in these times."
  - "I've got nothing worthy of a hero like you."
  - "Check back after the harvest."
  - "The rats ate the supplies. Big rats."
  - "I'm cleaning house. Everything is gone."
  - "Not even a rusty nail left."
  - "Demand is high, supply is low."
  - "I'm out of stock. Blame the economy."
  - "My wares are still in the raw stone."
  - "I haven't been to the market in weeks."
  - "All I have is this beard, and it's not for sale."
  - "Desolation. That's what's in my shop."
  - "Try the humans, they sell junk."

noQuestPhrases:
  - "The tunnels are quiet. Too quiet."
  - "No goblins to smash today, thankfully."
  - "Peace is good for business, bad for adventurers."
  - "The elders haven't assigned any tasks."
  - "I've got no work for a warrior."
  - "The deep roads are safe for now."
  - "Maybe you could just mine some coal?"
  - "No dragons nearby, sorry to disappoint."
  - "I'm content. You should be too."
  - "No news is good news in the dark."
  - "The ancestors are silent. So am I."
  - "Go polish your armor, I have nothing for you."
  - "We don't need help right now."
  - "The clan is handling its own problems."
  - "Maybe ask the King Under the Mountain."
  - "Just mining duties, nothing heroic."
  - "Everything is running smoothly."
  - "I've heard no rumors of trouble."
  - "Relax, take a load off."
  - "The beasts are sleeping."
  - "No rewards to give, so no quests to offer."
  - "My problem is an empty tankard, can you fix that?"
  - "The bridge is fixed, the gate is shut."
  - "Go find adventure elsewhere."
  - "We are secure. The walls hold."
  - "Nothing stirs in the dark."
  - "I'm too busy drinking to give orders."
  - "A quiet day is a blessing."
  - "Don't go looking for trouble."
  - "The mines are yielding well. No issues."

totemOfUndyingResurrectionPhrases:
  - "By Durin's beard, I still stand!"
  - "Not today, death! Not today!"
  - "The stone refused to take me!"
  - "I'm too stubborn to die!"
  - "Back from the halls of the ancestors!"
  - "That was close! Too close!"
  - "My work is not yet finished!"
  - "You can't keep a good dwarf down!"
  - "I saw the light, and I walked away!"
  - "Gold shines brightest after the dark!"
  - "The totem shattered, but I remain!"
  - "A second chance to smash heads!"
  - "I refuse to die sober!"
  - "By the hammer, I live!"
  - "My beard is still intact! Glory!"
  - "That... was unpleasant."
  - "The earth spat me back out!"
  - "I'm harder to kill than a cockroach!"
  - "Mahal has spared me!"
  - "Round two, you filth!"
  - "I'm still standing! Come and get me!"
  - "Death will have to wait!"
  - "A dwarf does not fall so easily!"
  - "Cheated death again!"
  - "The mountain protects its own."
  - "I felt the cold, but the fire remains!"
  - "Still breathing, still fighting!"
  - "You'll have to try harder than that!"
  - "Ancestors, guide my hand once more!"
  - "I am unbroken!"

imprisonedOrStuckPhrases:
  - "Get me out of here, or I'll smash these walls!"
  - "A cage cannot hold a son of the mountain!"
  - "I'm feeling claustrophobic! And I'm a dwarf!"
  - "Where is my pickaxe?! I'll dig my way out!"
  - "This is an insult to my clan!"
  - "Release me, you tall, lanky oafs!"
  - "The stone will hear my cry and tremble!"
  - "I'll headbutt these bars until they break!"
  - "Do you know who my father is?!"
  - "I'm stuck! A little help here!"
  - "This space is too small for my ego!"
  - "Let me out, I need ale!"
  - "Trapped like a rat in a mine!"
  - "I swear vengeance on whoever built this!"
  - "My beard is getting tangled in these bars!"
  - "I will crumble this prison to dust!"
  - "Help! A dwarf is in distress!"
  - "This lock is dwarven make... I can't pick it!"
  - "Free me, and I'll share my gold!"
  - "I'd rather be in a goblin pit than here!"
  - "Hey! Let me out!"
  - "I am not a display piece!"
  - "The walls are closing in!"
  - "I'm too heavy to be carried, just open the door!"
  - "This is undignified!"
  - "I'll bite the bars if I have to!"
  - "Open up! My axe is hungry!"
  - "Stuck tight. Need grease. Or magic."
  - "This is a violation of the mining code!"
  - "When I get out, heads will roll!"

