  - "Ha! Too slow!"
  - "Crumbled like sandstone!"
  - "Another notch on the axe."
  - "Down you go!"
  - "Tough as wet paper."
  - "Squashed like a bug."
  - "Rest in pieces."
  - "That felt good!"
  - "My hammer sings!"
  - "You were weak."
  - "Back to the mud with you."
  - "Hardly worth the effort."
  - "Clean cut. Good steel."
  - "Sleep with the worms."
  - "One less ugly face in the world."
  - "Did that hurt? Good."
  - "My grandmother fights better."
  - "Flattened!"
  - "You should have stayed in bed."
  - "The mountain claims you."
  - "Broken like cheap iron."
  - "Next!"
  - "I didn't even break a sweat."
  - "Tell your ancestors I sent you."
  - "Splat."
  - "Should have worn better armor."
