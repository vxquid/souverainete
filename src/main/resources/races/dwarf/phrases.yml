  - "Baruk Khazâd! Khazâd ai-mênu!"
  - "Taste my axe!"
  - "For the ancestors!"
  - "I'll trim your kneecaps!"
  - "To the stone with you!"
  - "You picked the wrong dwarf!"
  - "Hammer time!"
  - "I'll smash you into pebbles!"
  - "For the King Under the Mountain!"
  - "Your skull will make a fine cup!"
  - "Prepare to be shortened!"
  - "Feel the fury of the forge!"
  - "Iron and blood!"
  - "I'll bury you here!"
  - "Come here and face me!"
  - "No mercy for the weak!"
  - "Aaaaargh! Charge!"
  - "My axe thirsts!"
  - "I'll break your bones like twigs!"
  - "You are soft! I am rock!"
  - "Let's see what color your blood is!"
  - "For the clan!"
  - "Die, scum!"
  - "I'll make armor out of you!"
  - "Strike the earth! Strike the enemy!"
  - "Roar of the mountain!"
  - "You won't leave this tunnel alive!"
  - "Steel meets flesh!"
  - "I'm going to enjoy this!"
  - "Don't blink, or you'll miss your head coming off!"

