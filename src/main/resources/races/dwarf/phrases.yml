warningPhrases:
  - "Watch your step, long-shanks."
  - "My axe is twitching. Leave."
  - "This is dwarf territory. Back off."
  - "One more step and you'll be shorter."
  - "I don't trust your face. Move along."
  - "Don't test the mountain's patience."
  - "Walk away before I bury you."
  - "My hammer is heavy, and my temper is short."
  - "You're standing on dangerous ground."
  - "Leave, or become part of the foundation."
  - "I smell trouble. Is it you?"
  - "Keep your hands where I can see them."
  - "Do not provoke a son of Durin."
  - "The mines are closed to your kind."
  - "I advise you to turn around."
  - "This isn't a tavern. Get out."
  - "My patience is thinner than gold leaf."
  - "You are not welcome in these halls."
  - "Step back, or lose a foot."
  - "I'm watching you like a hawk. A cave hawk."

witnessMurderPhrases:
  - "By the beard! A murder!"
  - "You killed {victim}! You honorless dog!"
  - "Guards! Seal the gates! Killer!"
  - "Blood on the stone! {victim} is dead!"
  - "You'll pay for {victim}'s life with your own!"
  - "A grudge is written in the Book of Grudges!"
  - "Assassin! Strike him down!"
  - "Ancestors weep! {victim} has fallen!"
  - "You savage! You killed a kin!"
  - "To arms! Protect the clan!"
  - "There is no escape from dwarven justice!"
  - "You've spilled innocent blood! Die!"
  - "Curse you! {victim} didn't deserve that!"
  - "The rocks will crush you for this!"
  - "Murderer in the hall! Rally to me!"
  - "He killed {victim}! Avenge him!"
  - "Your head will roll for that!"
  - "Sound the alarm! We have a killer!"
  - "By the hammer, what have you done?!"
  - "You've made an enemy of the mountain today!"