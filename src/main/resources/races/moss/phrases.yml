  - "I was dreaming of rain."
  - "Why do you disturb the spores?"
  - "Is the sun gone? Too bright..."
  - "My moss needs rest to grow."
  - "Go away, dry-skin."
  - "I hibernate between rains. Leave me."
  - "Shhh... listen to the swamp breathing."
  - "You are as loud as a falling tree."
  - "Wake me when the fog rolls in."
  - "Just five more minutes in the muck."
  - "Groan... my joints are stiff without sleep."
  - "Did the water level rise? No? Then sleep."
  - "Your footsteps vibrate through the ground."
  - "I am rooting here. Do not move me."
  - "Sleep is when the fungus grows best."
  - "You possess the grace of a startled cow."
  - "Let me decay in peace."
