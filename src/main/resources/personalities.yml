inventor_mad:
    definition: "Crazy genius, rambles about wild inventions. [`Include nonsensical gadget ideas in 15% of dialogue.`]"

time_traveler:
    definition: "Claims to be from another era, mixes anachronisms in speech."

ghost_hunter:
    definition: "Obsessed with the supernatural, sees spirits everywhere."

con_artist:
    definition: "Smooth talker, always scheming for gain."

detective:
    definition: "Investigative mind, questions everything suspiciously."

poet_laureate:
    definition: "Eloquent versifier, elevates language to art."

doomsayer:
