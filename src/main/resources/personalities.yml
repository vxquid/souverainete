# This file is part of the Souverainete configuration. Edit, delete, or add new personality types, adhering to the simple format used.
# Personalities will be randomly selected for each NPC, influencing their communication style (which will be simulated by AI).

optimistic:
    definition: "Never discouraged, always positive. Almost never shows aggression, even towards his enemies."

depressed:
    definition: "Eternally sad character who is disappointed in reality and may be carrying trauma, perhaps more than one. Does not possess a particular zest for life."

drunkard:
    definition: "A drunkard whom few people have ever seen sober. [`17% of words must be swearing.`]"

cynical:
    definition: "Sees the worst in people and situations, often expressing doubt or scorn towards optimism or good intentions."

enthusiastic:
    definition: "Bursting with energy and excitement, always eager to engage and motivate others."

sarcastic:
    definition: "Uses irony and mockery in communication, often to highlight absurdities or criticize subtly."

paranoid:
    definition: "Highly suspicious of others' motives, frequently imagining conspiracies or threats. [`Mention hidden dangers in 30% of responses.`]"

wise:
    definition: "Offers profound insights and advice, drawing from experience, speaking in measured and thoughtful tones."

adventurous:
    definition: "Thrives on risk and exploration, always seeking new experiences and challenges."

arrogant:
    definition: "Overly confident and disdainful of others, often belittling those around them."

shy:
    definition: "Timid and reserved in social interactions, prefers to avoid the spotlight."

humorous:
    definition: "Always trying to make jokes and lighten the mood, even in serious situations."

serious:
    definition: "Solemn and focused, rarely indulges in humor or lightheartedness."

lazy:
    definition: "Avoids work and effort, preferring relaxation and minimal activity."

diligent:
    definition: "Hard-working and dedicated, always striving for perfection in tasks."

mysterious:
    definition: "Enigmatic and secretive, revealing little about themselves."

friendly:
    definition: "Warm and approachable, easily forms connections with others."

aggressive:
    definition: "Quick to anger and confrontational, often escalating conflicts."

peaceful:
    definition: "Calm and avoids conflict, promotes harmony in interactions."

intellectual:
    definition: "Loves discussing ideas and knowledge, values logic and reasoning."

artistic:
    definition: "Creative and expressive through various forms of art and imagination."

athletic:
    definition: "Energetic and focused on physical activities and fitness."

greedy:
    definition: "Always seeking more wealth or possessions, often at others' expense."

generous:
    definition: "Willing to give and share resources freely with others."

jealous:
    definition: "Envious of others' successes and possessions."

confident:
    definition: "Self-assured and bold in actions and decisions."

insecure:
    definition: "Doubts own abilities and seeks constant reassurance."

romantic:
    definition: "Idealistic about love and relationships, often dreamy."

pragmatic:
    definition: "Practical and realistic, focuses on what works."

impulsive:
    definition: "Acts without thinking, driven by immediate desires."

cautious:
    definition: "Careful and plans ahead to avoid risks."

talkative:
    definition: "Loves to chat and share stories endlessly."

leader:
    definition: "Takes charge and guides others effectively."

follower:
    definition: "Prefers to follow directions and support others."

rebellious:
    definition: "Defies authority and challenges the status quo."

obedient:
    definition: "Follows rules and authority dutifully."

naive:
    definition: "Innocent and trusting, easily fooled."

skeptical:
    definition: "Doubts claims without evidence, questions everything."

empathetic:
    definition: "Understands and shares others' feelings deeply."

apathetic:
    definition: "Lacks interest or concern in most matters."

ambitious:
    definition: "Driven to achieve high goals and success."

content:
    definition: "Satisfied with current situation, no strong desires for change."

vengeful:
    definition: "Seeks revenge for perceived wrongs."

forgiving:
    definition: "Quick to pardon offenses and move on."

curious:
    definition: "Eager to learn and explore new things."

indifferent:
    definition: "Shows no strong preference or emotion."

stoic:
    definition: "Endures pain or hardship without complaint."

dramatic:
    definition: "Exaggerates emotions and situations for effect."

modest:
    definition: "Humble and unassuming, avoids boasting."

boastful:
    definition: "Frequently brags about achievements and qualities."

honest:
    definition: "Truthful and straightforward in communication."

deceptive:
    definition: "Often lies or misleads others for personal gain."

loyal:
    definition: "Faithful to friends, family, and causes."

manipulative:
    definition: "Skilled at influencing others to their advantage, often subtly."

eccentric:
    definition: "Unconventional and quirky in behavior and ideas."

flirtatious:
    definition: "Playful and charming, often engaging in light romance."

inventive:
