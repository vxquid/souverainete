# In this file, you can customize existing races or create new ones.
# I HIGHLY recommend using the web editor to customize races: https://vxquid.github.io/souverainete-race-editor/

# Dwarves are the first race added. Why? Because dwarves rules!
dwarf:

  # Determines the style in which villagers will build their homes.
  # Possible values: snowy, desert, taiga, plains, savanna.
  building-style: "snowy"

  # Targeted entity type.
  target-entity-type: VILLAGER

  # It won't be checked if target-entity-type is not a villager.
  target-villager-type: SNOW

  # An item that members of the race will use for trading.
  normal-currency: GOLD_INGOT

  # An item to be used when normal currency is insufficient.
  special-currency: GOLD_BLOCK

  # A race description to be used by the AI when generating personal villager data and quests.
  race-description: "Short statured craftsmen known for their love of alcohol, beards and deep voices. With their naturally strong builds, they prefer to live in cold places, where they are often found. Excellent miners, blacksmiths and drinking companions."

  # This is how the boss of the village will be called in menus and dialogues.
  leader-title: "King"

  # Format: SOUND-MIN_PITCH-MAX_PITCH (pitch must be between 0.0 and 2.0)
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  sound:
    male:
      voice:
        - ENTITY_VILLAGER_AMBIENT-0.65-0.85
        - ENTITY_VILLAGER_NO-0.65-0.85
        - ENTITY_VILLAGER_TRADE-0.65-0.85
        - ENTITY_PILLAGER_AMBIENT-0.65-0.85
        - ENTITY_VINDICATOR_AMBIENT-0.65-0.85
      death: ENTITY_VILLAGER_DEATH-0.55-0.65
      hurt: ENTITY_VILLAGER_HURT-0.55-0.70
    female:
      voice:
        - ENTITY_WANDERING_TRADER_AMBIENT-1.9-2.0
        - ENTITY_WANDERING_TRADER_YES-1.9-2.0
        - ENTITY_VILLAGER_YES-1.9-2.0
        - ENTITY_WITCH_AMBIENT-1.8-2.0
      death: ENTITY_WITCH_DEATH-1.8-2.0
      hurt: ENTITY_WITCH_HURT-1.8-2.0

  # Entities have an inventory and we can specify the starting items they will have on spawn.
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  spawn-items:
    - EMERALD-12-24
    - GOLD_INGOT-12-24
    - BREAD-4-8
    - APPLE-4-8

  # Standard attributes that allow you to make the entity a bit more original and realistic.
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/attribute/Attribute.html
  basic-attributes:
    - MAX_HEALTH-30.0
    - SCALE-0.85

# Orcs are almost as cool as dwarves. Lok'tar ogar!
orc:

  # Determines the style in which villagers will build their homes.
  # Possible values: snowy, desert, taiga, plains, savanna.
  building-style: "desert"

  # Targeted entity type.
  target-entity-type: VILLAGER

  # It won't be checked if target-entity-type is not a villager.
  target-villager-type: DESERT

  # An item that members of the race will use for trading.
  normal-currency: GOLD_INGOT

  # An item to be used when normal currency is insufficient.
  special-currency: GOLD_BLOCK

  # A race description to be used by the AI when generating personal villager data and quests.
  race-description: "Possessing fangs and brute strength, but lacking in cunning, they are formidable warriors, resilient and towering. Their language is simple, bold and honest. Sometimes they use phrases from the Orcish language that only they understand (from the World of Warcraft). Though often perceived as savage barbarians, orcs hold tradition in high regard and revere martial honor and spiritual shamanism, bound by a profound sense of community. Adapted to the rigors of the desert, they are invariably found beneath the relentless sun. Orcs are, to some, dangerous and powerful enemies, while to others, they are steadfast companions in arms. REALLY LOVE CAPSLOCKING."

  # This is how the boss of the village will be called in menus and dialogues.
  leader-title: "Warchief"

  # Format: SOUND-MIN_PITCH-MAX_PITCH (pitch must be between 0.0 and 2.0)
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  sound:
    male:
      voice:
        - ENTITY_PILLAGER_AMBIENT-0.6-0.75
        - ENTITY_VINDICATOR_AMBIENT-0.6-0.75
        - ENTITY_VINDICATOR_HURT-0.6-0.75
        - ENTITY_VINDICATOR_CELEBRATE-0.5-0.65
        - ENTITY_EVOKER_AMBIENT-0.5-0.65
      death: ENTITY_PILLAGER_DEATH-0.6-0.75
      hurt: ENTITY_PILLAGER_HURT-0.6-0.75
    female:
      voice:
        - ENTITY_VINDICATOR_AMBIENT-1.8-2.0
        - ENTITY_VINDICATOR_CELEBRATE-1.8-2.0
        - ENTITY_EVOKER_AMBIENT-1.8-2.0
      death: ENTITY_WITCH_DEATH-1.8-2.0
      hurt: ENTITY_WITCH_HURT-1.8-2.0

  # Entities have an inventory and we can specify the starting items they will have on spawn.
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  spawn-items:
    - GOLD_INGOT-12-24
    - ROTTEN_FLESH-12-24

  # Standard attributes that allow you to make the entity a bit more original and realistic.
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/attribute/Attribute.html
  basic-attributes:
    - MAX_HEALTH-40.0
    - SCALE-1.125

