# Mandrathi race. Intelligent, agile jungle dwellers with a matriarchal society.
mandrathi:

  # Targeted entity type.
  target-entity-type: VILLAGER

  # It won't be checked if target-entity-type is not a villager.
  target-villager-type: JUNGLE

  # An item that members of the race will use for trading.
  normal-currency: EMERALD

  # An item to be used when normal currency is insufficient.
  special-currency: EMERALD_BLOCK

  # A race description to be used by the AI when generating personal villager data and quests.
  race-description: "The Mandrati are a race of intelligent ape-like humanoids inhabiting dense jungles. Their fur-covered bodies and long arms make them skilled climbers, effortlessly navigating tree canopies. Their society is matriarchal, with wise female elders leading tribes according to ancient traditions and a deep connection to nature. Known for their agility, strength, and cunning, the Mandrati inspire both awe and fear in those who trespass into their domain. They possess a unique language of vocalizations and gestures, and their shamans commune with forest spirits. While generally peaceful, they fiercely defend their territory from outsiders. Their language barely resembles human language and so everything they say sounds very primitive and strange. They hardly understand what being polite means, they are beasts after all."

  # This is how the boss of the village will be called in menus and dialogues.
  leader-title: "Matriarch"

  # Format: SOUND-MIN_PITCH-MAX_PITCH (pitch must be between 0.0 and 2.0)
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  sound:
    male:
      voice:
        - ENTITY_VILLAGER_AMBIENT-0.8-1.0
        - ENTITY_VILLAGER_YES-0.8-1.0
        - ENTITY_VILLAGER_NO-0.8-1.0
        - ENTITY_VILLAGER_TRADE-0.8-1.0
      death: ENTITY_VILLAGER_DEATH-0.8-1.0
      hurt: ENTITY_VILLAGER_HURT-0.8-1.0
    female:
      voice:
        - ENTITY_VILLAGER_AMBIENT-1.2-1.4
        - ENTITY_VILLAGER_YES-1.2-1.4
        - ENTITY_VILLAGER_NO-1.2-1.4
        - ENTITY_VILLAGER_TRADE-1.2-1.4
      death: ENTITY_VILLAGER_DEATH-1.2-1.4
      hurt: ENTITY_VILLAGER_HURT-1.2-1.4

  # Entities have an inventory, and we can specify the starting items they will have on spawn.
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
