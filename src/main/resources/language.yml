    resume-info: "§7Unfinished translating session found! Use §6/s translate resume §7to continue."
    accept-prompt: "§7Type §6/s translate accept §7to start."
    already-running: "§cTranslation is already in progress!"
    quota-exceeded: "§eQuota exceeded! §7Waiting 60 seconds to reset..."
    success: "§aAll race files have been translated and cached."
    bossbar:
      initializing: "§dAI: Initializing..."
      processing: "§dAI: {race} - {file} ({progress}%)"
      cooldown: "§eAI: Cooldown {time}s..."
      quota-wait: "§cAI: Quota limit! Retrying in {time}s..."

info-messages:
  premium-only: "This feature is only available in the premium version."
  quest-chat-info:
