# Language file.
# Automatic on-the-fly translation by AI will be used unless disabled in config.yml.

# If the player has turned off immersive dialogs with the "/q dialogue format CHAT" command.
villager-message-chat-format: "§6{villagerName}§7: §r{message}"

# Reputation change messages.
settlement-reputation:
  increase: "§9Reputation with {entity} increased by {amount}."
  decrease: "§9Reputation with {entity} decreased by {amount}."
  status-update: "§eYour reputation with {entity} has shifted to {status}."

# Settlement related messages.
settlement:
  entering: "You entering a settlement."
  leaving: "You leaving a settlement."
  created: "§eA new settlement has been founded: §6{settlementName}§e."

  size:
    underdeveloped: "Underdeveloped"
    emerging: "Emerging"
    established: "Established"
    advanced: "Advanced"
    metropolis: "Metropolis"

  # Menu translations
  menu:
    common:
      back: "§cBack"
    main:
      title: "§8{name}"
      stats:
        name: "§e📜 Information"
        lore:
          - "§7Population: §b{pop}"
          - "§7Beds: §e{beds}"
          - "§7Size: §a{size}"
          - "§7Established: §f{date}"
          - ""
          - "§7Reputation: {rep}"
      population:
        name: "§a👥 Citizens"
        lore:
          - "§7Click to view resident list."
      settings:
        name: "§6⚙ Management"
        lore:
          - "§7Rename and settings."
    population:
      title: "§8Citizens ({count})"
      head-lore:
        - "§7Job: §f{job}"
        - "§7Health: §c{hp}§7/§c{max_hp}"
    settings:
      title: "§8Management"
      rename:
        name: "§e✎ Rename Settlement"
        lore:
          - "§7Current: §f{name}"
          - ""
          - "§eClick to type new name."
    rename:
      prompt: "§eWrite new name in chat (or 'cancel'):"
      cancelled: "§cCancelled."
      success: "§aSettlement renamed to: §6{name}"

# Raid system messages.
raid:
  bossbar:
    init: "Raid Initialization..."
    defenders-alive: "Defenders Alive: {count}"
    title: "{attacker} ⚔ {defender} (Wave {wave}/{total})"
    victory-primary: "Attackers defeated!"
    victory-secondary: "Settlement protected!"
    loss-primary: "Settlement conquered!"
    loss-secondary: "Defenders eliminated!"
    stopped-primary: "Raid stopped!"
    stopped-secondary: "Combat ceased!"
  entity:
    raider-name: "§cRaider ({attacker})"
  chat:
    wave-started: "§c⚔ A raid wave has started! §6{attacker} §cis attacking §6{defender}§c!"
    reinforcements: "§c⚔ Reinforcements have arrived for §6{attacker}§c!"
    victory: "§a⚔ The raid on §6{defender} §ahas been repelled! Victory!"
    loss: "§4☠ §c{defender} has fallen! Conquered by §4{attacker}§c. It is now known as §6{newName}§c."
    loss-wiped: "§4☠ §cThe settlement {defender} has been wiped out!"

quest:
  finished: "You have finished the quest §6{quest}§7."
  failed:
    npcDeath: "Quest §6{quest} §7was failed; villager who gave you a quest is dead."
